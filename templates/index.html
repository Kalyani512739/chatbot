<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Assistant</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"/>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>

  <style>

    *, *::before, *::after {
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    :root{
      --purple:#c084fc;
      --indigo:#818cf8;
      --glass:rgba(255,255,255,0.42);
      --glass-b:rgba(255,255,255,0.72);
      --text-dark:#2d1f5e;
      --text-mid:#6d5da8;
      --text-soft:#a99ccc;
      --shadow:rgba(140,100,220,0.18);
      --danger:#f87171;
    }

    html,body{
      height:100%;
      font-family:'DM Sans',sans-serif;
      background:linear-gradient(135deg,#fce4f5 0%,#ddd6fe 45%,#bfdbfe 100%);
      overflow:hidden;
    }

    .blob{
      position:fixed;
      border-radius:50%;
      filter:blur(70px);
      opacity:0.5;
      pointer-events:none;
      animation:blobFloat 10s ease-in-out infinite;
    }

    .b1{
      width:500px;
      height:500px;
      background:radial-gradient(circle,#f9a8d4,#c084fc);
      top:-140px;
      left:-120px;
    }

    .b2{
      width:420px;
      height:420px;
      background:radial-gradient(circle,#a5b4fc,#60a5fa);
      bottom:-100px;
      right:-100px;
    }

    @keyframes blobFloat{
      0%,100%{
        transform:translateY(0) scale(1);
      }
      50%{
        transform:translateY(-30px) scale(1.05);
      }
    }

    .layout{
      position:relative;
      z-index:1;
      display:grid;
      grid-template-columns:280px 1fr;
      height:100vh;
    }

    /* SIDEBAR */

    .sidebar{
      background:rgba(255,255,255,0.3);
      border-right:1.5px solid var(--glass-b);
      backdrop-filter:blur(28px);
      padding:24px 14px;
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }

    .sidebar-logo{
      display:flex;
      align-items:center;
      gap:10px;
      padding-bottom:20px;
    }

    .logo-orb{
      width:34px;
      height:34px;
      border-radius:50%;
      background:linear-gradient(135deg,#c084fc,#818cf8);
    }

    .logo-text{
      font-family:'Playfair Display',serif;
      font-size:18px;
      color:var(--text-dark);
    }

    .new-chat-btn{
      width:100%;
      padding:12px;
      border:none;
      border-radius:14px;
      background:rgba(255,255,255,0.4);
      color:var(--text-dark);
      font-weight:600;
      cursor:pointer;
      margin-bottom:20px;
      backdrop-filter:blur(10px);
      transition:0.2s;
    }

    .new-chat-btn:hover{
      background:rgba(255,255,255,0.6);
    }

    .history-container{
      flex:1;
      overflow-y:auto;
      padding-right:4px;
    }

    .history-title{
      font-size:12px;
      color:var(--text-soft);
      margin-bottom:10px;
      padding-left:5px;
    }

    .history-item{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:10px 12px;
      border-radius:12px;
      margin-bottom:8px;
      background:rgba(255,255,255,0.25);
      cursor:pointer;
      transition:0.2s;
    }

    .history-item:hover{
      background:rgba(255,255,255,0.45);
    }

    .history-text{
      flex:1;
      overflow:hidden;
      white-space:nowrap;
      text-overflow:ellipsis;
      color:var(--text-dark);
      font-size:13px;
    }

    .delete-chat{
      background:none;
      border:none;
      color:#ef4444;
      cursor:pointer;
      font-size:16px;
    }

    .user-card{
      display:flex;
      align-items:center;
      gap:10px;
      padding:12px;
      border-radius:16px;
      background:rgba(255,255,255,0.45);
      border:1.5px solid var(--glass-b);
      margin-top:15px;
    }

    .user-avatar{
      width:34px;
      height:34px;
      border-radius:50%;
      background:linear-gradient(135deg,#f9a8d4,#c084fc);
      display:flex;
      align-items:center;
      justify-content:center;
      color:white;
      font-weight:600;
    }

    .user-name{
      font-size:13px;
      font-weight:600;
      color:var(--text-dark);
    }

    .user-role{
      font-size:11px;
      color:var(--text-soft);
    }

    .logout-btn{
      text-decoration:none;
      background:#ef4444;
      color:white;
      padding:8px 12px;
      border-radius:10px;
      font-size:11px;
      font-weight:600;
    }

    /* MAIN */

    .main{
      display:flex;
      flex-direction:column;
      height:100vh;
    }

    .topbar{
      padding:20px 36px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .topbar-title{
      font-family:'Playfair Display',serif;
      color:var(--text-mid);
      font-size:20px;
    }

    .chat-area{
      flex:1;
      overflow-y:auto;
      padding:20px;
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    .welcome-text{
      margin-top:120px;
      text-align:center;
    }

    .welcome-text h1{
      font-size:36px;
      color:var(--text-dark);
      line-height:1.4;
    }

    .welcome-text p{
      margin-top:10px;
      color:var(--text-mid);
    }

    .messages-wrap{
      width:100%;
      max-width:760px;
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .msg-row{
      display:flex;
      gap:10px;
    }

    .msg-row.user{
      justify-content:flex-end;
    }

    .bubble{
      max-width:70%;
      padding:14px 18px;
      border-radius:20px;
      line-height:1.7;
      word-wrap:break-word;
    }

    .bubble.user{
      background:linear-gradient(135deg,#c084fc,#818cf8);
      color:white;
    }

    .bubble.bot{
      background:rgba(255,255,255,0.58);
      border:1.5px solid var(--glass-b);
      color:var(--text-dark);
      backdrop-filter:blur(12px);
    }

    .input-area{
      padding:20px;
      display:flex;
      justify-content:center;
    }

    .input-box{
      width:100%;
      max-width:760px;
      display:flex;
      align-items:center;
      gap:10px;
      background:rgba(255,255,255,0.52);
      border:1.5px solid var(--glass-b);
      border-radius:28px;
      padding:8px 10px;
      backdrop-filter:blur(16px);
    }

    #userInput{
      flex:1;
      border:none;
      background:transparent;
      outline:none;
      font-size:15px;
      color:var(--text-dark);
    }

    .attach-btn{
      width:38px;
      height:38px;
      border-radius:50%;
      background:rgba(192,132,252,0.15);
      border:1.5px solid rgba(192,132,252,0.3);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
    }

    .send-btn{
      height:42px;
      padding:0 20px;
      border:none;
      border-radius:22px;
      background:linear-gradient(135deg,#c084fc,#818cf8);
      color:white;
      cursor:pointer;
      font-weight:600;
    }

  </style>
</head>

<body>

<div class="blob b1"></div>
<div class="blob b2"></div>

<div class="layout">

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="sidebar-logo">

      <div class="logo-orb"></div>

      <span class="logo-text">
        AI
      </span>

    </div>

    <button class="new-chat-btn" onclick="newChat()">
      + New Chat
    </button>

    <div class="history-container">

      <div class="history-title">
        Recent Chats
      </div>

      <div id="historyList"></div>

    </div>

    <div class="user-card">

      <div class="user-avatar">
        {{ session['user'][0].upper() }}
      </div>

      <div style="flex:1;">

        <div class="user-name">
          {{ session['user'] }}
        </div>

        <div class="user-role">
          Logged in
        </div>

      </div>

      <a href="/logout" class="logout-btn">
        Logout
      </a>

    </div>

  </aside>

  <!-- MAIN -->

  <main class="main">

    <div class="topbar">

      <span class="topbar-title">
        AI Assistant
      </span>

    </div>

    <div class="chat-area">

      <div class="welcome-text">

        <h1>
          Hello, {{ session['user'] }}!<br>
          How can I help you today?
        </h1>

        <p>
          Ask me anything — I'm here to assist you.
        </p>

      </div>

      <div class="messages-wrap" id="messages"></div>

    </div>

    <div class="input-area">

      <div class="input-box">

        <label class="attach-btn">

          📎

          <input type="file" id="pdfInput" hidden>

        </label>

        <input
          id="userInput"
          type="text"
          placeholder="Ask me anything..."
        >

        <button
          class="send-btn"
          onclick="sendMessage()"
        >
          Send
        </button>

      </div>

    </div>

  </main>

</div>

<script>

const messages = document.getElementById('messages');

const historyList = document.getElementById('historyList');

let chats = [];

let currentChatId = null;

// -----------------------
// Add Message
// -----------------------

function addMessage(text,role){

  const row = document.createElement('div');

  row.className = `msg-row ${role}`;

  const bubble = document.createElement('div');

  bubble.className = `bubble ${role}`;

  if(role === 'bot'){
    bubble.innerHTML = marked.parse(text);
  }else{
    bubble.textContent = text;
  }

  row.appendChild(bubble);

  messages.appendChild(row);

  messages.scrollTop = messages.scrollHeight;

}

// -----------------------
// Save Chat
// -----------------------

function saveCurrentChat(){

  if(!currentChatId) return;

  const chat = chats.find(c => c.id === currentChatId);

  if(chat){

    chat.html = messages.innerHTML;

  }

  renderHistory();

}

// -----------------------
// Render History
// -----------------------

function renderHistory(){

  historyList.innerHTML = '';

  chats.forEach(chat => {

    const div = document.createElement('div');

    div.className = 'history-item';

    div.innerHTML = `

      <div class="history-text">
        ${chat.title}
      </div>

      <button
        class="delete-chat"
        onclick="deleteChat(event,'${chat.id}')"
      >
        ✕
      </button>

    `;

    div.addEventListener('click', () => {

      loadChat(chat.id);

    });

    historyList.prepend(div);

  });

}

// -----------------------
// New Chat
// -----------------------

function newChat(){

  messages.innerHTML = '';

  currentChatId = null;

}

// -----------------------
// Load Chat
// -----------------------

function loadChat(id){

  const chat = chats.find(c => c.id === id);

  if(!chat) return;

  currentChatId = id;

  messages.innerHTML = chat.html;

}

// -----------------------
// Delete Chat
// -----------------------

function deleteChat(event,id){

  event.stopPropagation();

  chats = chats.filter(chat => chat.id !== id);

  if(currentChatId === id){

    newChat();

  }

  renderHistory();

}

// -----------------------
// Send Message
// -----------------------

async function sendMessage(){

  const input = document.getElementById('userInput');

  const text = input.value.trim();

  if(!text) return;

  // Create New Chat

  if(!currentChatId){

    currentChatId = Date.now().toString();

    chats.push({

      id:currentChatId,

      title:text.substring(0,30),

      html:''

    });

  }

  addMessage(text,'user');

  input.value='';

  try{

    const response = await fetch('/chat',{

      method:'POST',

      headers:{
        'Content-Type':'application/json'
      },

      body:JSON.stringify({
        message:text
      })

    });

    const data = await response.json();

    addMessage(data.reply,'bot');

    saveCurrentChat();

  }catch(error){

    addMessage('Something went wrong 😑','bot');

  }

}

// -----------------------
// Enter Key
// -----------------------

document.getElementById('userInput').addEventListener('keydown',function(e){

  if(e.key==='Enter'){

    sendMessage();

  }

});

// -----------------------
// PDF Upload
// -----------------------

document.getElementById('pdfInput').addEventListener('change', async function(){

  const file = this.files[0];

  if(!file) return;

  const formData = new FormData();

  formData.append('pdf', file);

  try{

    const response = await fetch('/upload',{

      method:'POST',

      body:formData

    });

    const data = await response.json();

    addMessage(data.message,'bot');

  }catch(error){

    addMessage('Upload failed 😑','bot');

  }

});

</script>

</body>
</html>
